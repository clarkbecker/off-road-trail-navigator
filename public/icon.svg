    <polygon points="0,-45 18,25 0,10 -18,25" fill="#ef4444" />
    <polygon points="0,45 18,-25 0,-10 -18,-25" fill="#94a3b8" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>
</svg>
