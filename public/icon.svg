<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Mountain contours -->
  <path d="M40 370 L190 180 L290 290 L390 140 L472 260 L472 430 L40 430 Z" fill="#1e293b" opacity="0.8" />
  <path d="M80 430 L220 250 L310 350 L432 200 L472 260 L472 430 Z" fill="#334155" opacity="0.6" />
  <!-- Trail Path -->
  <path d="M90 430 Q 180 340, 240 330 T 360 270 T 430 170" fill="none" stroke="url(#accent)" stroke-width="14" stroke-dasharray="16,12" stroke-linecap="round" />
  <!-- Waypoint Marker -->
  <circle cx="430" cy="170" r="24" fill="#f97316" stroke="#ffffff" stroke-width="6" />
  <circle cx="430" cy="170" r="8" fill="#ffffff" />
